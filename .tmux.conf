unbind C-b
set -g prefix C-z
bind C-z send-prefix

setw -g mode-keys emacs

# pane move key
bind w switch-client -T pane-move
bind -T pane-move w choose-tree -wZ
bind -T pane-move h select-pane -L
bind -T pane-move j select-pane -D
bind -T pane-move k select-pane -U
bind -T pane-move l select-pane -R

set -g set-clipboard on