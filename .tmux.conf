unbind C-b
set -g prefix C-z
bind C-z send-prefix

setw -g mode-keys emacs

# Keep pane numbers (prefix q) on screen for 2 seconds.
set -g display-panes-time 2000

# pane move key
# bind w switch-client -T pane-move
# bind -T pane-move w choose-tree -wZ
# bind -T pane-move h select-pane -L
# bind -T pane-move j select-pane -D
# bind -T pane-move k select-pane -U
# bind -T pane-move l select-pane -R

set -g set-clipboard on
# Support for modern keyboard protocols (CSI u)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Copy mode: start selection with Ctrl+Space.
# WezTerm (Windows) sends Ctrl+Space as Ctrl+Shift+F7 because the Windows console
# drops Ctrl from it (see wezterm.lua), so bind that key as well as C-Space.
bind-key -T copy-mode C-S-F7 send-keys -X begin-selection

# Ctrl+J: WezTerm (Windows) sends it as Ctrl+Shift+F10 (see wezterm.lua) because the
# console turns Ctrl+J into a plain Enter.  In a Claude Code pane send Alt+Enter
# (newline) instead; every other pane gets the carrier as is (Emacs maps it to C-j).
bind-key -n C-S-F10 if-shell -F '#{m:*claude*,#{pane_current_command}}' 'send-keys M-Enter' 'send-keys C-S-F10'
