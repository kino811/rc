unbind C-b
set -g prefix C-z
bind C-z send-prefix

setw -g mode-keys emacs

# pane move key
# bind w switch-client -T pane-move
# bind -T pane-move w choose-tree -wZ
# bind -T pane-move h select-pane -L
# bind -T pane-move j select-pane -D
# bind -T pane-move k select-pane -U
# bind -T pane-move l select-pane -R

set -g set-clipboard on
# Support for modern keyboard protocols (CSI u)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Copy mode: start selection with Ctrl+Space.
# WezTerm (Windows) sends Ctrl+Space as Ctrl+Shift+F7 because the Windows console
# drops Ctrl from it (see wezterm.lua), so bind that key as well as C-Space.
bind-key -T copy-mode C-S-F7 send-keys -X begin-selection
